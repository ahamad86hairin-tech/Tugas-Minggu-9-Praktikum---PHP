<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 35px 16px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            color: #222;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 28px;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,.08);
        }
        h2 { margin: 0 0 22px; font-size: 23px; }
        .field { margin-bottom: 15px; }
        label.title {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
        }
        .hobbies label {
            display: block;
            margin: 7px 0;
            font-size: 14px;
        }
        button {
            padding: 9px 15px;
            border: 0;
            border-radius: 4px;
            background: #087bfa;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { background: #0668d5; }
    </style>
</head>
<body>
    <main class="container">
        <h2>Formulir Data Diri</h2>

        <form action="proses_data_diri.php" method="POST">
            <div class="field">
                <label class="title" for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" required>
            </div>

            <div class="field">
                <label class="title" for="tanggal_lahir">Tanggal Lahir:</label>
                <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>
            </div>

            <div class="field hobbies">
                <span class="title">Hobi:</span>
                <label><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
                <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
                <label><input type="checkbox" name="hobi[]" value="Musik"> Musik</label>
                <label><input type="checkbox" name="hobi[]" value="Lainnya"> Lainnya</label>
            </div>

            <button type="submit">Kirim</button>
        </form>
    </main>
</body>
</html>
